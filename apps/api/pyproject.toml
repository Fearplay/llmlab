[project]
name = "llmlab-api"
version = "0.1.0"
description = "FastAPI backend for LLMLab"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "keyring>=25,<26",
  "numpy>=2.2,<3",
  "Pillow>=11,<13",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.4,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
training = ["torch>=2.7,<3"]
rag = ["sentence-transformers>=5,<6"]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "respx>=0.22,<1", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmlab_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
