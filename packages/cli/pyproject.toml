[project]
name = "llmlab-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pyyaml>=6.0,<7"]

[project.scripts]
llmlab = "llmlab_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmlab_cli"]
